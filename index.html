<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pink Heart</title>

<style>
html,body {
  height:100%;
  margin:0;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff5f8;
}

.heart {
  position:relative;
  width:160px;
  height:160px;
  background:#ff69b4;
  transform:rotate(-45deg);
  box-shadow:0 15px 40px rgba(255,105,180,.35);
}

.heart::before,
.heart::after {
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  background:#ff69b4;
  border-radius:50%;
}

.heart::before {
  top:-80px;
  left:0;
}

.heart::after {
  top:0;
  left:80px;
}
</style>
</head>

<body>
  <div class="heart"></div>
</body>
</html>
